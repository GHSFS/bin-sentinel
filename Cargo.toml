[package]
name = "bin-sentinel"
version = "0.8.0"
edition = "2021"
rust-version = "1.75"
description = "Zero-dependency binary forensics, PE/ELF static analyzer, packer entropy detector, and declarative byte-patching toolkit in pure Rust."
authors = ["GHSFS"]
license = "Apache-2.0"
repository = "https://github.com/GHSFS/bin-sentinel"
readme = "README.md"
keywords = ["binary-analysis", "pe-parser", "forensics", "reverse-engineering", "security"]
categories = ["command-line-utilities", "development-tools", "parser-implementations"]

[lib]
name = "bin_sentinel"
path = "src/lib.rs"

[[bin]]
name = "bsentinel"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"
zeroize = { version = "1.8", features = ["derive"] }

[dev-dependencies]
tempfile = "3.10"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
